# schedule.yaml — 番組表の唯一の「正」
# version: 4 / updated: 2026-11-19 JST
# 生成スケジューラ・AzuraCast放送・Podcast化はすべてこの定義から決める。
# ステーションは id=11「ねるるの日常(健全版)」(旧 id=8 から移行済み)。
#
# この版に含まれる決定事項:
# - 長編: 毎日 12 / 15 / 18 / 21 時、各 30〜45分
# - 曜日別グリッドの実行正本は schedule/*.yaml (2026-11-20〜)。
#   scheduler は当日の曜日のファイルを引き、枠ごとに生成する番組を決める
# - 長編の曜日別編成を本格化し、全28枠の番組を確定 (2026-11-19 優)
#   - 月〜木: 帯編成 (12 ブログトーク / 15 ガジェットマニア /
#             18 自鯖のある生活 / 21 ねるるの日常)
#   - 金: 12 ブログトーク / 15 ガジェットマニア /
#         18 土曜日、日曜日に行きたい！関東の魅力再発見！ / 21 朗読
#   - 土: 12 関東お出かけガイド / 15 ガジェットマニア (週末版) /
#         18 自鯖のある生活 (休日メンテ編) / 21 ねるるの日常 (週末版)
#   - 日: 12 お昼、何食べる？ / 15 ガジェットマニア /
#         18 いま、このインディーズバンドが熱い！！！ / 21 ねるるの眠れない話
# - ニュース: 毎日 10 / 11 / 13 / 14 / 16 / 17 / 19 / 20 / 22 時、各 約10分
#   (2026-11-19 優: 長編の無い時間帯をお試しでニュース枠に割り当て)
# - ニュースの出力は news_latest.mp3 に統一し、毎回上書きする (2026-11-19)
#   AzuraCast 側は news_latest 1曲のプレイリスト + スケジュールブロックで受ける
# - 情報: 毎時 :15 = 交通情報、:45 = 天気情報、各 約3分 (180秒)
# - 情報は AzuraCast のスケジュール機能で長編の途中にも強制割り込みする
# - 長編の原稿に天気・渋滞を混ぜない (情報は独立スポットに分離)

version: 4
timezone: Asia/Tokyo

