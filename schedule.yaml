# ============================================================
# レーン2: 情報スポット (毎時 :15 = 交通 / :45 = 天気、各 約3分)
# 長編とは別生成・別ファイル・別プレイリスト。
# AzuraCast のスケジュール機能で長編の途中にも強制割り込みする (決定済み)。
# 唐突にならないよう、入り/出のジングルで枠を明示する。
# ============================================================
info_spots:
  - id: traffic
    kind: traffic                      # JARTIC
    title: "交通情報"
    schedule: { minute: 15 }           # 毎時15分
    active_hours: "<未決定>"           # 24時間か、放送時間帯のみか
    generate_before_minutes: 5         # 情報は鮮度が命。直前に最新データで生成
    duration_target_sec: 180           # 約3分想定 (2026-11-17 決定)
    script:
      mode: template                   # 定型フォーマットに最新データを差し込む。
                                       # LLM の創作を入れない = 唐突感とコストを両方消す
      fit_rule: trim_items             # 3分に収める方法は atempo の速度上げではなく
                                       # 項目数の削減を優先 (読み上げの聞き取りやすさ優先)
    jingle: { in: true, out: true }    # 「ここで交通情報です」を枠として明示
    speakers: []                       # 未決定 (元は雨晴はうが交通担当)
    output: rotating                   # traffic_latest.mp3 を上書きし続ける (アーカイブしない)
    azuracast: { station: 11, playlist: "traffic-spot", interrupt: true }
    podcast: false                     # 鮮度が切れる情報は Podcast に載せない
    during_long_programs: interrupt    # AzuraCast スケジュールで強制割り込み (決定済み)

  - id: weather
    kind: weather                      # 気象庁
    title: "天気情報"
    schedule: { minute: 45 }           # 毎時45分
    active_hours: "<未決定>"
    generate_before_minutes: 5
    duration_target_sec: 180           # 約3分想定 (2026-11-17 決定)
    script:
      mode: template
      fit_rule: trim_items             # 項目数の削減で尺を合わせる (atempo 優先にしない)
    jingle: { in: true, out: true }    # 「ここでお天気です」を枠として明示
    speakers: []                       # 未決定 (元は雨晴はうが天気担当)
    output: rotating                   # weather_latest.mp3 を上書きし続ける
    azuracast: { station: 11, playlist: "weather-spot", interrupt: true }
    podcast: false
    during_long_programs: interrupt    # ただし長編が45分尺だと終了時刻と重なる点に注意 (PLAN参照)

# ============================================================
# レーン1b: ニュース番組「ネルラジニュース」(2026-11-19 追加)
# 長編の無い時間帯を埋める約10分枠。NHK + ITmedia の RSS から
# 見出しを取り、トップ記事の本文をスクレイピングして深堀りする。
# 深堀りの話題は当日の使い回しを避け、枠ごとに新しいものを選ぶ。
# 出力は news_latest.mp3 に統一し毎回上書き (2026-11-19)。
# ============================================================
news:
  - id: neruraji-news
    title: "ネルラジニュース"
    schedule: { days: [mon, tue, wed, thu, fri, sat, sun],
                times: ["10:00", "11:00", "13:00", "14:00", "16:00",
                        "17:00", "19:00", "20:00", "22:00"] }
    generate_before_minutes: 10
    duration_target_sec: 600           # 約10分 (原稿 2800〜3400字)
    generator: py/tools/run_news_job.py
    prompt: prompts/steps/news-program.md
    sources: ["NHK RSS (cat0)", "ITmedia RSS (news_bursts)"]
    output: "news_latest.mp3"
    azuracast: { station: 11 }
    podcast: false                     # 鮮度が切れる情報は Podcast に載せない

# ============================================================
# 生成キューの原則
# ============================================================
# - ジョブは直列実行 (VOICEVOX 合成が CPU を使うため並列にしない)
# - 締切が近い情報スポットを優先し、長編は先行枠の中で空き時間に作る
# - 対象回のファイルが既にあればスキップ (冪等)
# - AzuraCast の割り込みは割り込まれたトラックがスポット後に途中再開する挙動。
#   1回の割り込みでタイムラインが約3分ずれる (同居人環境で挙動確認済み)
