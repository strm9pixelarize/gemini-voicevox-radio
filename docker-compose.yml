# AI ラジオ生成系 (Portainer Stack: Git リポジトリから登録する)
# スケジューラが毎時 :10 交通 / :40 天気を生成し、ホストの output/ に
# 置く。output/ は AzuraCast へ bind mount 済み (nerurus_room_rest)。
#
# コードの置き場所 (2026-11-19 変更): リポジトリをホストの
# /DATA/AppData/azuracast_program に clone し、py/ と prompts/ を
# コンテナへ bind mount して「ホストのファイルそのもの」を動かす。
# VS Code で眺め・編集でき、辞書の自動追記もホスト側に残る。
# コード更新の手順: ホストで git pull → コンテナを再起動 (restart)。
# compose や Dockerfile の変更時だけ Pull and redeploy が必要。
services:
  radio-scheduler:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      VOICEVOX_HOST: http://voicevox.enoki.local
      SPOT_OUT_DIR: /data/output
      SPOT_ASSETS_DIR: /data/assets
      SPOT_STATE_FILE: /data/state/scheduler_state.json
      # 長編の自動生成（12/15/18/21時の10分前に生成開始）
      PROGRAM_OUT_DIR: /data/output
      PROGRAM_STATE_FILE: /data/state/program_state.json
      PROGRAM_WORK_DIR: /data/state/program_work
      PROGRAM_TOPICS: /data/state/program_topics.json
      # Anthropic API キー。Portainer の Stack 環境変数で入れること
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RADIO_MODEL: claude-haiku-5-5
      # Discord 通知用 Webhook。Portainer の Stack 環境変数で入れること
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # フォールバック用URL
      VOICEVOX_HOST_FALLBACK: http://192.168.108.200:50021
    extra_hosts:
      - "voicevox.enoki.local:192.168.104.3"
    volumes:
      - /DATA/AppData/azuracast_program/output:/data/output
      - /DATA/AppData/azuracast_program/assets:/data/assets:ro
      - /DATA/AppData/azuracast_program/state:/data/state
      # コードはホストの clone をそのまま使う (イメージ焼き込みより優先される)
      - /DATA/AppData/azuracast_program/py:/app/py:ro
      - /DATA/AppData/azuracast_program/prompts:/app/prompts
      # 曜日別の番組表。VS Code で編集すれば再起動なしで翌枠から効く
      - /DATA/AppData/azuracast_program/schedule:/app/schedule:ro
