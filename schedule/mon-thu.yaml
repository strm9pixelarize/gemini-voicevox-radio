# 月曜〜木曜の編成 (帯編成)
# scheduler が当日の曜日に対応するこのファイルを読み、枠ごとに
# 生成する番組を決める。値は生成器の種別:
#   gadget = ガジェットマニア (run_program_job.py)
#   blog   = ブログトーク (run_blog_job.py)
#   jisaba = 自鯖のある生活 (run_jisaba_job.py)
#   none   = 生成しない
slots:
  "12": blog    # ブログトーク
  "15": gadget  # ガジェットマニア
  "18": jisaba  # 自鯖のある生活
  "21": gadget  # 本来は「ねるるの日常」。同上
